<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI聊聊 · 对话首页</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #E8E3EF;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 375px;
    min-height: 812px;
    background: #F7F4FB;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(82,63,113,0.08), 0 8px 40px rgba(82,63,113,0.12);
    display: flex;
    flex-direction: column;
  }

  /* ── 1. 身份信息行 ── */
  .identity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 0;
  }

  .avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7562a6, #9b85b8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .identity-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .identity-name {
    font-size: 15px;
    font-weight: 700;
    color: #3D3327;
    line-height: 1.3;
  }

  .identity-sub {
    font-size: 12px;
    color: #A39588;
    line-height: 1.3;
  }

  /* ── 2. Hero 区域 ── */
  .hero-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 16px 28px;
  }

  .decorative-circles {
    position: relative;
    width: 120px;
    height: 100px;
    margin-bottom: 20px;
  }

  .dc-purple {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7562a6, #5E6AD2);
    opacity: 0.85;
    top: 0;
    left: 0;
  }

  .dc-white {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid rgba(94,106,210,0.1);
    box-shadow: 0 4px 16px rgba(94,106,210,0.15);
    top: 20px;
    left: 40px;
  }

  .hero-title {
    font-size: 20px;
    font-weight: 700;
    color: #3D3327;
    text-align: center;
    margin-bottom: 8px;
  }

  .hero-subtitle {
    font-size: 13px;
    color: #A39588;
    text-align: center;
    line-height: 1.4;
  }

  /* ── 3. 开始聊天按钮 ── */
  .btn-start-chat {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 16px;
    padding: 16px 0;
    background: linear-gradient(135deg, #7562a6, #5E6AD2);
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(94,106,210,0.3);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-start-chat:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(94,106,210,0.25);
    transition: transform 0.1s ease;
  }

  /* ── 4. 待确认提醒卡 ── */
  .pending-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 16px 8px;
    padding: 14px 16px;
    background: #FDF5E6;
    border: 1px solid rgba(232,165,71,0.25);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
  }

  .pending-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pending-icon-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #E8A547;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .pending-label {
    font-size: 14px;
    font-weight: 700;
    color: #8C6A00;
  }

  .pending-arrow {
    font-size: 16px;
    color: #E8A547;
    flex-shrink: 0;
  }

  /* ── 5. 查看全部聊天记录 ── */
  .view-all-link {
    display: block;
    text-align: center;
    padding: 12px 16px 8px;
    font-size: 14px;
    color: #6B5D4F;
    text-decoration: none;
    cursor: pointer;
  }

  /* ── 6. Footer ── */
  .page-footer {
    text-align: center;
    padding: 16px 16px 24px;
    font-size: 11px;
    color: #A39588;
    border-top: 1px solid rgba(119,98,168,0.08);
    margin-top: auto;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- 1. 身份信息行 -->
  <div class="identity-row">
    <div class="avatar-circle">🌻</div>
    <div class="identity-text">
      <span class="identity-name">小宇的 AI聊聊</span>
      <span class="identity-sub">记录今天发生的事</span>
    </div>
  </div>

  <!-- 2. Hero 区域 -->
  <div class="hero-section">
    <div class="decorative-circles">
      <div class="dc-purple"></div>
      <div class="dc-white"></div>
    </div>
    <h1 class="hero-title">今天想记录什么？</h1>
    <p class="hero-subtitle">AI会帮你把对话整理成档案记录</p>
  </div>

  <!-- 3. 开始聊天按钮 -->
  <button class="btn-start-chat" data-dom-id="btn-start-chat">开始聊天</button>

  <!-- 4. 待确认提醒卡 -->
  <a class="pending-card" data-dom-id="btn-pending-review" href="#">
    <div class="pending-left">
      <div class="pending-icon-circle">📋</div>
      <span class="pending-label">2条记录待确认</span>
    </div>
    <span class="pending-arrow">›</span>
  </a>

  <!-- 5. 查看全部聊天记录 -->
  <a class="view-all-link" href="#">查看全部聊天记录</a>

  <!-- 6. Footer -->
  <div class="page-footer">AI懂我 · 心智障碍者动态支持档案</div>
</div>
</body>
</html>
