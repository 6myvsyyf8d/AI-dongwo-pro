<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI聊聊 · 对话首页</title>
<style id="theme-vars">
:root,[data-theme="light"]{--kanban-bg-page:#f5f5f7;--kanban-bg-card:#ffffff;--kanban-bg-header:#ffffff;--kanban-bg-input:#f5f5f7;--kanban-bg-hover:rgba(0,0,0,0.04);--kanban-text-primary:#1d1d1f;--kanban-text-secondary:#6e6e73;--kanban-text-muted:#aeaeb2;--kanban-text-inverse:#ffffff;--kanban-border:#e5e5ea;--kanban-border-light:rgba(0,0,0,0.06);--kanban-accent-orange:#e7ad51;--kanban-accent-purple:#9ba5ff;--kanban-accent-green:#4fc083;--kanban-primary:#5e6ad2;--kanban-primary-hover:#4f5bc4;--kanban-primary-light:rgba(94,106,210,0.08);--kanban-overlay:rgba(0,0,0,0.5);--kanban-sheet-bg:#ffffff;--kanban-sheet-handle:#d1d1d6;--kanban-input-border:#e5e5ea;--kanban-input-focus:#5e6ad2;--kanban-error:#e34d4d;--kanban-error-bg:rgba(227,77,77,0.06);--kanban-success:#4fc083;--kanban-toast-bg:rgba(0,0,0,0.85);--kanban-shadow-sm:0 1px 3px rgba(0,0,0,0.06);--kanban-shadow-md:0 2px 12px rgba(0,0,0,0.08);--kanban-shadow-lg:0 8px 40px rgba(0,0,0,0.16);--kanban-shadow-sheet:0 -4px 24px rgba(0,0,0,0.12);--kanban-radius-sm:8px;--kanban-radius-md:12px;--kanban-radius-lg:16px;--kanban-radius-xl:22px;--kanban-radius-full:9999px;--kanban-dot-size:8px;--kanban-background:#f5f5f7;--kanban-foreground:#1d1d1f;--kanban-card:#ffffff;--kanban-card-foreground:#1d1d1f;--kanban-primary:#5e6ad2;--kanban-primary-foreground:#ffffff;--kanban-muted:#f5f5f7;--kanban-muted-foreground:#6e6e73;--kanban-border:#e5e5ea;--kanban-ring:#5e6ad2;--kanban-radius-sm:8px;--kanban-radius-md:12px;--kanban-radius-lg:16px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style type="text/tailwindcss">
@theme inline{--color-background:var(--kanban-background);--color-foreground:var(--kanban-foreground);--color-card:var(--kanban-card);--color-card-foreground:var(--kanban-card-foreground);--color-primary:var(--kanban-primary);--color-primary-foreground:var(--kanban-primary-foreground);--color-muted:var(--kanban-muted);--color-muted-foreground:var(--kanban-muted-foreground);--color-border:var(--kanban-border);--color-ring:var(--kanban-ring);--radius-sm:var(--kanban-radius-sm);--radius-md:var(--kanban-radius-md);--radius-lg:var(--kanban-radius-lg)}@layer base{body{background:var(--kanban-background);color:var(--kanban-foreground)}}
</style>
<style id="semantic-token-fallback">
.bg-background{background-color:var(--kanban-background)}.text-foreground{color:var(--kanban-foreground)}.bg-card{background-color:var(--kanban-card)}.text-primary{color:var(--kanban-primary)}.bg-primary{background-color:var(--kanban-primary)}.bg-muted{background-color:var(--kanban-muted)}.border-border{border-color:var(--kanban-border)}
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #E8E3EF;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .phone-frame {
    width: 375px;
    min-height: 100vh;
    background: #F7F4FB;
    border-radius: 20px;
    box-shadow: 0 2px 12px rgba(82,63,113,0.08), 0 8px 40px rgba(82,63,113,0.12);
    display: flex;
    flex-direction: column;
  }

  /* ── 1. 身份信息行 ── */
  .identity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 16px 0;
  }

  .avatar-circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7562a6, #9b85b8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .identity-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .identity-name {
    font-size: 15px;
    font-weight: 700;
    color: #3D3327;
    line-height: 1.3;
  }

  .identity-sub {
    font-size: 12px;
    color: #A39588;
    line-height: 1.3;
  }

  /* ── 2. Hero 区域 ── */
  .hero-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 16px 28px;
  }

  .decorative-circles {
    position: relative;
    width: 120px;
    height: 100px;
    margin-bottom: 20px;
  }

  .dc-purple {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7562a6, #5E6AD2);
    opacity: 0.85;
    top: 0;
    left: 0;
  }

  .dc-white {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 2px solid rgba(94,106,210,0.1);
    box-shadow: 0 4px 16px rgba(94,106,210,0.15);
    top: 20px;
    left: 40px;
  }

  .hero-title {
    font-size: 20px;
    font-weight: 700;
    color: #3D3327;
    text-align: center;
    margin-bottom: 8px;
  }

  .hero-subtitle {
    font-size: 13px;
    color: #A39588;
    text-align: center;
    line-height: 1.4;
  }

  /* ── 3. 开始聊天按钮 ── */
  .btn-start-chat {
    display: block;
    width: calc(100% - 32px);
    margin: 0 16px 16px;
    padding: 16px 0;
    background: linear-gradient(135deg, #7562a6, #5E6AD2);
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(94,106,210,0.3);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-start-chat:active {
    transform: scale(0.98);
    box-shadow: 0 2px 8px rgba(94,106,210,0.25);
    transition: transform 0.1s ease;
  }

  /* ── 4. 待确认提醒卡 ── */
  .pending-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 16px 8px;
    padding: 14px 16px;
    background: #FDF5E6;
    border: 1px solid rgba(232,165,71,0.25);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
  }

  .pending-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pending-icon-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #E8A547;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .pending-label {
    font-size: 14px;
    font-weight: 700;
    color: #8C6A00;
  }

  .pending-arrow {
    font-size: 16px;
    color: #E8A547;
    flex-shrink: 0;
  }

  /* ── 5. 查看全部聊天记录 ── */
  .view-all-link {
    display: block;
    text-align: center;
    padding: 12px 16px 8px;
    font-size: 14px;
    color: #6B5D4F;
    text-decoration: none;
    cursor: pointer;
  }

  /* ── 6. Footer ── */
  .page-footer {
    text-align: center;
    padding: 16px 16px 24px;
    font-size: 11px;
    color: #A39588;
    border-top: 1px solid rgba(119,98,168,0.08);
    margin-top: auto;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <!-- 1. 身份信息行 -->
  <div class="identity-row">
    <div class="avatar-circle">🌻</div>
    <div class="identity-text">
      <span class="identity-name">小宇的 AI聊聊</span>
      <span class="identity-sub">记录今天发生的事</span>
    </div>
  </div>

  <!-- 2. Hero 区域 -->
  <div class="hero-section">
    <div class="decorative-circles">
      <div class="dc-purple"></div>
      <div class="dc-white"></div>
    </div>
    <h1 class="hero-title">今天想记录什么？</h1>
    <p class="hero-subtitle">AI会帮你把对话整理成档案记录</p>
  </div>

  <!-- 3. 开始聊天按钮 -->
  <button class="btn-start-chat" data-dom-id="btn-start-chat">开始聊天</button>

  <!-- 4. 待确认提醒卡 -->
  <a class="pending-card" data-dom-id="btn-pending-review" href="#">
    <div class="pending-left">
      <div class="pending-icon-circle">📋</div>
      <span class="pending-label">2条记录待确认</span>
    </div>
    <span class="pending-arrow">›</span>
  </a>

  <!-- 5. 查看全部聊天记录 -->
  <a class="view-all-link" href="#">查看全部聊天记录</a>

  <!-- 6. Footer -->
  <div class="page-footer">AI懂我 · 心智障碍者动态支持档案</div>
</div>
</body>
<script>
  // 「开始聊天」→ 跳转对话页
  document.querySelector('.btn-start-chat')?.addEventListener('click', function() {
    window.location.href = 'chat-conversation.html';
  });
  // 待确认卡 → 跳转整理页
  document.querySelector('.pending-card')?.addEventListener('click', function(e) {
    e.preventDefault();
    window.location.href = 'chat-review.html';
  });
  // 查看全部
  document.querySelector('.view-all-link')?.addEventListener('click', function(e) {
    e.preventDefault();
    alert('聊天记录功能即将上线');
  });
</script>
</html>
